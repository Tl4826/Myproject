    const CountUp = ({ value }) => {
        const [n, setN] = useState(0);
        useEffect(() => {
            let raf, t0; const from = n;
            const step = t => { t0 = t0 ?? t; const k = Math.min((t - t0) / 600, 1); setN(Math.round(from + (value - from) * (1 - Math.pow(1 - k, 3)))); if (k < 1) raf = requestAnimationFrame(step); };
            raf = requestAnimationFrame(step);
            return () => cancelAnimationFrame(raf);
        }, [value]);
        return n;
    };

    const GOALS = [['lose', '📉 Giảm cân'], ['gain_muscle', '🏋️ Tăng cơ'], ['gain', '📈 Tăng cân'], ['keep', '⚖️ Giữ cân']];

    const VN_DISHES = [
        { name: 'Phở bò', calories: 450, protein: 28, carbs: 55, fat: 12 },

    const suggestDishes = (goal, remaining, targetCal) => {
        const score = { lose: d => -d.protein / d.calories, gain_muscle: d => -d.protein, gain: d => -d.calories, keep: d => Math.abs(d.calories - targetCal / 3) }[goal];
        return VN_DISHES.filter(d => d.calories <= remaining).sort((x, y) => score(x) - score(y)).slice(0, 3);
    };
    // Lộ trình: p = hồ sơ, pl = {targetWeight, weeks} hoặc null. 1 kg ≈ 7700 kcal
    const computePlan = (p, pl) => {
        const bmr = p.gender === 'male' ? 10 * p.weight + 6.25 * p.height - 5 * p.age + 5 : 10 * p.weight + 6.25 * p.height - 5 * p.age - 161;
        const tdee = Math.round(bmr * p.activity);
        const floor = p.gender === 'male' ? 1500 : 1200;
        const dir = p.goal === 'lose' ? -1 : p.goal === 'keep' ? 0 : 1;
        let daily = { lose: -400, gain_muscle: 300, gain: 500, keep: 0 }[p.goal];
        let weekly = 0, weeks = 0, minWeeks = 0, capped = false;
        if (dir && pl && (pl.targetWeight - p.weight) * dir > 0) {
            const diff = pl.targetWeight - p.weight;
            const maxRate = dir < 0 ? Math.min(1, 0.01 * p.weight) : (p.goal === 'gain_muscle' ? 0.35 : 0.5); // kg/tuần an toàn
            minWeeks = Math.ceil(Math.abs(diff) / maxRate);
            weeks = Math.max(pl.weeks, minWeeks);
            capped = weeks > pl.weeks;
            weekly = diff / weeks;
            daily = Math.round(weekly * 7700 / 7);
        }
        let targetCal = Math.round(tdee + daily), floored = false;
        if (targetCal < floor) { targetCal = floor; floored = true; }
        const protein = Math.round(p.weight * { lose: 1.8, gain_muscle: 2.0, gain: 1.6, keep: 1.4 }[p.goal]);
        const fat = Math.round(targetCal * 0.25 / 9);
        const carbs = Math.max(Math.round((targetCal - protein * 4 - fat * 9) / 4), 0);
        return { tdee, targetCal, daily: targetCal - tdee, weekly, weeks, minWeeks, capped, floored, floor, protein, fat, carbs, water: (p.weight * 0.035).toFixed(1), glasses: Math.ceil(p.weight * 35 / 250) };
    };
    const workoutToday = p => {
        const n = p.activity >= 1.725 ? 5 : p.activity >= 1.55 ? 4 : 3;
        const days = { 3: [1, 3, 5], 4: [1, 2, 4, 5], 5: [1, 2, 3, 5, 6] }[n]; // getDay(): 0 = CN
        const idx = days.indexOf(new Date().getDay());
        const starter = p.activity <= 1.2 ? ' Mới bắt đầu thì làm 15–20 phút rồi tăng dần.' : '';
        if (idx < 0) return { title: 'Ngày nghỉ chủ động', text: 'Đi bộ nhẹ 20–30 phút hoặc giãn cơ 10–15 phút. Cơ bắp phục hồi và phát triển trong ngày nghỉ.' };
        if (p.goal === 'lose') return idx % 2 === 0

        if (p.goal === 'gain_muscle') return { title: idx % 2 === 0 ? 'Tập thân trên' : 'Tập thân dưới', text: '45–60 phút tập kháng lực, 3–4 bài chính × 3–4 hiệp, tăng dần mức tạ. Ăn đủ đạm sau buổi tập.' + starter };
        if (p.goal === 'gain') return { title: 'Tập tạ toàn thân', text: '40–50 phút ưu tiên bài compound (squat, đẩy ngực, kéo xà/kéo cáp), hạn chế cardio quá nhiều.' + starter };

    function NutriApp() {
        const [meals, setMeals] = useState(() => load('nv_meals', INITIAL_MEALS).filter(m => !m.name.includes('Cà Phê')).map(m => ({ date: dayKey(new Date()), ...m })));
        const [activeTab, setActiveTab] = useState('home');
        const [heroScanState, setHeroScanState] = useState('idle');
        const [heroScannedDish, setHeroScannedDish] = useState(null);
        const [scanErr, setScanErr] = useState('');

        const today = dayKey(new Date());
        const todayMeals = meals.filter(m => m.date === today);
        const sum = k => todayMeals.reduce((a, m) => a + (m[k] || 0), 0);

                {isAuthOpen && (
                    <div onMouseMove={tilt} className="fade fixed inset-0 z-50 overflow-y-auto bg-gradient-to-br from-emerald-900 via-emerald-700 to-teal-500">
                        <div className="pointer-events-none absolute -top-24 -left-24 w-80 h-80 bg-lime-300/40 rounded-full blur-3xl"></div>
                        <div className="pointer-events-none absolute bottom-0 -right-24 w-96 h-96 bg-teal-300/40 rounded-full blur-3xl"></div>
                        <FruitScene />
                        <button onClick={() => setIsAuthOpen(false)} className="absolute top-4 left-4 z-10 text-white/90 hover:text-white font-bold text-sm">← Trang chủ</button>
                        <div className="relative min-h-full flex items-center justify-center p-5 pt-14">
                            <div className="w-full max-w-sm bg-white/10 backdrop-blur-xl border border-white/30 rounded-[2rem] shadow-2xl p-7 space-y-5 text-white">
                                <div className="text-center space-y-1">
                                    <h2 className="text-3xl font-black">{authMode === 'login' ? 'Chào mừng trở lại' : 'Tạo tài khoản'}</h2>
                                    <p className="text-sm text-white/80">{authMode === 'login' ? 'Đăng nhập để tiếp tục với NutriVN' : 'Đăng ký để theo dõi dinh dưỡng mỗi ngày'}</p>
                                </div>

                                <form onSubmit={handleAuthSubmit} className="space-y-3 text-sm">
                                    {authMode === 'register' && <input type="text" value={authName} onChange={e => setAuthName(e.target.value)} placeholder="Họ và tên" required className={glassInput} />}
                                    <input type="email" value={userEmail} onChange={e => setUserEmail(e.target.value)} placeholder="Email" required className={glassInput} />
                                    <div className="relative">
                                        <input type={showPw ? 'text' : 'password'} placeholder="Mật khẩu" required minLength={6} autoComplete={authMode === 'login' ? 'current-password' : 'new-password'} className={glassInput + ' pr-11'} />
                                        <button type="button" onClick={() => setShowPw(!showPw)} aria-label="Hiện/ẩn mật khẩu" className="absolute right-3 top-1/2 -translate-y-1/2">{showPw ? '🙈' : '👁️'}</button>
                                    </div>
                                    {authMode === 'login' && (
                                        <div className="flex items-center justify-between text-xs font-semibold">
                                            <label className="flex items-center gap-2 cursor-pointer">
                                                <input type="checkbox" checked={rememberMe} onChange={e => setRememberMe(e.target.checked)} className="w-4 h-4 accent-white" />
                                                Ghi nhớ đăng nhập
                                            </label>
                                            <a href="#" onClick={e => e.preventDefault()} className="hover:underline">Quên mật khẩu?</a>
                                        </div>
                                    )}
                                    <button type="submit" className="w-full py-3.5 bg-white/90 hover:bg-white text-slate-900 font-black rounded-2xl shadow-lg">
                                        {authMode === 'login' ? 'Đăng nhập' : 'Tạo tài khoản'}
                                    </button>
                                </form>

                                <div className="space-y-2.5 text-sm">
                                    <div className="flex items-center text-[11px] text-white/70 font-bold"><span className="flex-1 border-t border-white/30"></span><span className="px-3">HOẶC</span><span className="flex-1 border-t border-white/30"></span></div>
                                    {GOOGLE_CLIENT_ID
                                        ? <div id="g-btn" className="flex justify-center"></div>
                                        : <button type="button" onClick={() => notify('Chưa điền GOOGLE_CLIENT_ID')} className="w-full py-3 bg-white/90 hover:bg-white text-slate-800 rounded-2xl font-bold flex items-center justify-center gap-2">
                                            <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
                                            Tiếp tục với Google
                                        </button>}
                                    <button type="button" onClick={fbLogin} className="w-full py-3 bg-[#1877F2] hover:bg-[#166fe0] text-white rounded-2xl font-bold flex items-center justify-center gap-2">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M24 12.07C24 5.41 18.63 0 12 0S0 5.41 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.7 4.53-4.7 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.89v2.26h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07z"/></svg>
                                        Tiếp tục với Facebook
                                    </button>
                                </div>

                                <p className="text-center text-xs text-white/80">
                                    {authMode === 'login' ? 'Chưa có tài khoản? ' : 'Đã có tài khoản? '}
                                    <button type="button" onClick={() => setAuthMode(authMode === 'login' ? 'register' : 'login')} className="font-black text-white hover:underline">{authMode === 'login' ? 'Tạo tài khoản' : 'Đăng nhập'}</button>
                                </p>
                            </div>
                        </div>
                    </div>
                )}

                {isLoggedIn && isOnboardOpen && (() => {
                    const bmi = bmiInfo(Number(obWeight), Number(obHeight));
                    const fld = 'w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm';
                    return (
                        <div className="fixed inset-0 z-[55] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
                            <form onSubmit={saveProfile} className="fade bg-white rounded-3xl p-5 max-w-sm w-full space-y-4 shadow-2xl">
                                <div className="text-center space-y-1">
                                    <div className="text-4xl">👋</div>
                                    <h3 className="font-black text-lg text-slate-900">Chào mừng đến NutriVN!</h3>
                                    <p className="text-xs text-slate-500 font-medium">Cho mình biết một chút về bạn để tính BMI, gợi ý mục tiêu và lượng calo phù hợp.</p>
                                </div>
                                <div className="space-y-3 text-xs">
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-500">Họ và tên</label>
                                        <input type="text" value={obName} onChange={e => setObName(e.target.value)} placeholder="Nguyễn Văn A" className={fld} />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-500">Tuổi</label>
                                            <input type="number" inputMode="numeric" value={obAge} onChange={e => setObAge(e.target.value)} placeholder="20" className={fld} />
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-500">Giới tính</label>
                                            <select value={obGender} onChange={e => setObGender(e.target.value)} className={fld}>
                                                <option value="male">Nam</option>
                                                <option value="female">Nữ</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-500">Chiều cao (cm)</label>
                                            <input type="number" inputMode="decimal" value={obHeight} onChange={e => setObHeight(e.target.value)} placeholder="170" className={fld} />
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-500">Cân nặng (kg)</label>
                                            <input type="number" inputMode="decimal" value={obWeight} onChange={e => setObWeight(e.target.value)} placeholder="65" className={fld} />
                                        </div>
                                    </div>
                                    {bmi ? (
                                        <div className="p-3 bg-slate-50 border border-slate-200 rounded-2xl text-center">
                                            <div className="text-[10px] font-bold text-slate-500">Chỉ số BMI của bạn</div>
                                            <div className="text-2xl font-black text-slate-900">{bmi.value} <span className={'text-sm ' + bmi.color}>{bmi.label}</span></div>
                                        </div>
                                    ) : (
                                        <p className="text-[10px] text-slate-400 font-bold text-center italic">Nhập chiều cao và cân nặng để xem BMI</p>
                                    )}
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-500">Mục tiêu của bạn{bmi ? ' (đã gợi ý theo BMI)' : ''}</label>
                                        <div className="grid grid-cols-2 gap-1.5 mt-1">
                                            {GOALS.map(([k, label]) => {
                                                const sel = (obGoal || (bmi ? suggestGoal(bmi.value) : '')) === k;
                                                const sug = bmi && suggestGoal(bmi.value) === k;
                                                return (
                                                    <button key={k} type="button" onClick={() => setObGoal(k)} className={`p-2 rounded-xl border font-bold relative ${sel ? 'bg-emerald-50 border-emerald-500 text-emerald-700' : 'bg-slate-50 border-slate-200 text-slate-600'}`}>
                                                        {label}
                                                        {sug && <span className="absolute -top-1.5 right-1.5 text-[9px] bg-emerald-600 text-white rounded-full px-1.5">Gợi ý</span>}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-500">Mức vận động</label>
                                        <select value={obActivity} onChange={e => setObActivity(e.target.value)} className={fld}>
                                            <option value={1.2}>Ít vận động</option>
                                            <option value={1.375}>Nhẹ (1-3 buổi/tuần)</option>
                                            <option value={1.55}>Vừa (3-5 buổi/tuần)</option>
                                            <option value={1.725}>Nhiều (6-7 buổi/tuần)</option>
                                        </select>
                                    </div>
                                    {obErr && <p className="text-[11px] font-bold text-rose-600 text-center">{obErr}</p>}
                                </div>
                                <div className="space-y-2">
                                    <button type="submit" className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-sm rounded-2xl shadow-sm">LƯU & BẮT ĐẦU</button>
                                    <button type="button" onClick={() => setIsOnboardOpen(false)} className="w-full py-2 text-xs font-bold text-slate-400 hover:text-slate-600">Để sau</button>
                                </div>
                            </form>
                        </div>
                    );
                })()}

                {toast && (
                    <div className="fixed bottom-24 inset-x-0 flex justify-center z-[60] pointer-events-none">
                        <div className="fade bg-slate-900/90 text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-lg">{toast}</div>
                    </div>
                )}

                {isLoggedIn && (<>
                <footer className="max-w-xl mx-auto mt-8 px-4 py-4 border-t border-slate-200 text-center space-y-2 text-xs">
                    <div className="flex justify-center space-x-4 text-slate-500 font-bold">
                        <a href="https://www.facebook.com/huy.vo.59895?locale=vi_VN" target="_blank" rel="noreferrer" className="hover:text-emerald-600">Facebook</a>
                        <a href="https://zalo.me/0905467532" target="_blank" rel="noreferrer" className="hover:text-emerald-600">Zalo</a>
                        <a href="https://github.com/Huysadboy2610" target="_blank" rel="noreferrer" className="hover:text-emerald-600">GitHub</a>
                        <button onClick={() => setIsTeamOpen(true)} className="hover:text-emerald-600 cursor-pointer">Ban Lãnh Đạo</button>
                    </div>
                    <p className="text-[10px] text-slate-400 font-bold">© 2026 NutriVN FoodTech AI. All rights reserved.</p>
                </footer>

                {isTeamOpen && (
                    <TeamMembersModal onClose={() => setIsTeamOpen(false)} />
                )}
                </>)}
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<NutriApp />);
</script>
</body>
</html>
