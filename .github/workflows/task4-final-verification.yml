name: Task 4 authenticated production verification
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/task4-final-verification.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORIGIN: https://nutrivn-myproject.vercel.app
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false lighthouse@12 puppeteer@24
      - name: Test real session, diary API, and authenticated Lighthouse
        run: |
          mkdir -p evidence
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          import assert from 'node:assert/strict';
          import {randomUUID} from 'node:crypto';
          import puppeteer from 'puppeteer';
          import lighthouse from 'lighthouse';
          const origin=process.env.ORIGIN;
          const result={origin,checkedAt:new Date().toISOString(),checks:[],scores:[],note:'One synthetic QA account; remove only its test meal and session. No real user data. Account record may remain. Authenticated API and Lighthouse checks; consent test intercepts all telemetry.'};
          const save=()=>fs.writeFile('evidence/summary.json',JSON.stringify(result,null,2));
          const check=async(name,fn)=>{try{result.checks.push({name,pass:true,...await fn()});}catch(e){result.checks.push({name,pass:false,error:String(e.message).slice(0,180)});}await save();};
          const email='task4-qa-'+randomUUID()+'@example.invalid',password=randomUUID()+randomUUID();
          let cookie='',mealId='';
          async function request(path,method='GET',body,session=cookie){
            return fetch(origin+path,{method,headers:{Origin:origin,...(session?{Cookie:session}:{}),...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(45000)});
          }
          await check('register one synthetic QA account',async()=>{
            const r=await request('/api/email-auth','POST',{action:'register',email,password,name:'NutriVN QA',remember:false},'');
            assert.equal(r.status,201);cookie=(r.headers.get('set-cookie')||'').split(';')[0];assert.ok(cookie.startsWith('nutrivn_session='));return {status:r.status};
          });
          await check('AUTH-007 reject incorrect password',async()=>{
            const r=await request('/api/email-auth','POST',{action:'login',email,password:randomUUID(),remember:false},'');assert.equal(r.status,401);assert.equal(r.headers.has('set-cookie'),false);return {status:r.status};
          });
          await check('verify server session',async()=>{
            assert.ok(cookie);const r=await request('/api/social-auth');assert.equal(r.status,200);const b=await r.json();assert.equal(b.user?.provider,'email');assert.equal(b.user?.email,email);return {status:r.status};
          });
          await check('diary rejects guest',async()=>{const r=await request('/api/diary','GET',undefined,'');assert.equal(r.status,401);return {status:r.status};});
          await check('diary create/read/update/delete synthetic row',async()=>{
            assert.ok(cookie);const initial=await request('/api/diary');assert.equal(initial.status,200);assert.equal((await initial.json()).meals?.length,0);
            const r=await request('/api/diary','POST',{name:'QA synthetic food',date:new Date().toISOString().slice(0,10),category:'lunch',calories:null,protein:null,carbs:null,fat:null});
            assert.equal(r.status,201);mealId=(await r.json()).meal?.id;assert.ok(mealId);
            const list=await request('/api/diary');assert.equal(list.status,200);assert.ok((await list.json()).meals.some(x=>x.id===mealId));
            const patch=await request('/api/diary','PATCH',{id:mealId,category:'dinner'});assert.equal(patch.status,200);
            const updated=await request('/api/diary');assert.equal(updated.status,200);assert.equal((await updated.json()).meals.find(x=>x.id===mealId)?.category,'dinner');
            const del=await request('/api/diary?id='+encodeURIComponent(mealId),'DELETE');assert.equal(del.status,200);const after=await request('/api/diary');assert.equal(after.status,200);assert.equal((await after.json()).meals.some(x=>x.id===mealId),false);mealId='';return {created:true,updated:true,deleted:true};
          });
          try {
            for(const path of ['/home','/diary','/baocao']){
              await check('authenticated Lighthouse '+path,async()=>{
                assert.ok(cookie);const browser=await puppeteer.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
                try{
                  await browser.setCookie({name:'nutrivn_session',value:cookie.slice('nutrivn_session='.length),url:origin,secure:true,httpOnly:true,sameSite:'Lax'});
                  const page=await browser.newPage();
                  await page.goto(origin+path,{waitUntil:'domcontentloaded',timeout:60000});
                  await page.waitForSelector('main',{visible:true,timeout:45000});
                  assert.equal(new URL(page.url()).pathname,path);
                  await page.close();
                  const audit=await lighthouse(origin+path,{port:Number(new URL(browser.wsEndpoint()).port),output:['html','json'],logLevel:'error',disableStorageReset:true,onlyCategories:['performance','accessibility','best-practices','seo']});
                  assert.ok(audit&&!audit.lhr.runtimeError);assert.equal(new URL(audit.lhr.finalDisplayedUrl||audit.lhr.finalUrl).pathname,path);
                  const scores=Object.fromEntries(Object.entries(audit.lhr.categories).map(([k,v])=>[k,Math.round(v.score*100)]));
                  result.scores.push({route:path,...scores});
                  // Only publish numeric summaries; authenticated raw reports may contain test session metadata.
                  return {scores};
                }finally{await browser.close();}
              });
            }
            await check('consent on all public routes, exclusion on authenticated routes and decline',async()=>{
              assert.ok(cookie);
              const browser=await puppeteer.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
              const consent={origin,checkedAt:new Date().toISOString(),checks:[],note:'Third-party telemetry requests intercepted; no GA4 or Sentry data delivered by this test. Synthetic inputs only; no raw envelopes or session metadata retained.'};
              const record=name=>consent.checks.push({name,pass:true});
              let stage='initialization';
              try{
                await browser.setCookie({name:'nutrivn_session',value:cookie.slice('nutrivn_session='.length),url:origin,secure:true,httpOnly:true,sameSite:'Lax'});
                const page=await browser.newPage();
                let gaLoads=0,gaRequests=0,sentryRequests=0,events=[];
                await page.setRequestInterception(true);
                page.on('request',async r=>{
                  try{
                    const host=new URL(r.url()).hostname;
                    const isGA=['googletagmanager.com','google-analytics.com','analytics.google.com'].some(d=>host===d||host.endsWith('.'+d));
                    if(isGA){
                      gaRequests++;if(host.endsWith('googletagmanager.com'))gaLoads++;
                      return await r.respond({status:200,contentType:'application/javascript',body:''});
                    }
                    if(host==='sentry.io'||host.endsWith('.sentry.io')){
                      sentryRequests++;
                      if(r.method()==='POST'){
                        try{const raw=r.postData()||await r.fetchPostData();events.push(JSON.parse(raw.trim().split('\n')[2]));}catch{events.push(null);}
                      }
                      return await r.respond({status:200,headers:{'access-control-allow-origin':'*','access-control-allow-methods':'POST, OPTIONS','access-control-allow-headers':'*'},body:''});
                    }
                    await r.continue();
                  }catch{if(!r.isInterceptResolutionHandled())await r.abort().catch(()=>{});}
                });
                const settle=()=>new Promise(r=>setTimeout(r,1000));
                const emit=()=>page.evaluate(()=>window.dispatchEvent(new ErrorEvent('error',{message:'synthetic-privacy-marker'})));
                const counts=()=>[gaRequests,sentryRequests,events.length];
                const publicRoutes=['/','/about','/contact'];
                const selector='aside[aria-label="Tùy chọn đo lường"] button';
                const chooseConsent=async(choice,handles=null)=>{
                  stage='click consent '+choice;
                  const buttons=handles||await page.$(selector);
                  assert.equal(buttons.length,2,'Expected exactly two consent controls');
                  const labels=await Promise.all(buttons.map(b=>b.evaluate(el=>el.textContent.trim())));
                  assert.match(labels[0],/Cho phép/);assert.match(labels[1],/Từ chối/);
                  try{
                    // Use the already-mounted control; do not wait for a second query after the synthetic event.
                    await buttons[choice==='yes'?0:1].click();
                  }finally{if(!handles)await Promise.all(buttons.map(b=>b.dispose()));}
                  stage='verify persisted consent '+choice;
                  await page.waitForFunction(c=>localStorage.getItem('nv_optional_diagnostics')===c,{timeout:15000},choice);
                };
                await page.goto(origin+'/',{waitUntil:'domcontentloaded',timeout:60000});
                await page.waitForSelector(selector,{timeout:30000});
                const initialConsentButtons=await page.$(selector);
                assert.equal(initialConsentButtons.length,2,'Expected two consent buttons on initial public page');
                await emit();await settle();assert.deepEqual(counts(),[0,0,0]);record('default off');
                await chooseConsent('yes',initialConsentButtons);
                await Promise.all(initialConsentButtons.map(b=>b.dispose()));
                for(const path of publicRoutes){
                  stage='public route '+path;
                  if(path!=='/')await page.goto(origin+path+'?qa=synthetic-privacy-marker',{waitUntil:'domcontentloaded',timeout:60000});
                  assert.equal(new URL(page.url()).pathname,path);
                  await page.waitForSelector(selector,{timeout:30000});
                  await page.waitForFunction(p=>Array.isArray(window.dataLayer)&&window.dataLayer.some(a=>a[0]==='event'&&a[1]==='page_view'&&a[2]?.page_location===p),{timeout:15000},origin+path);
                  const views=await page.evaluate(()=>window.dataLayer.filter(a=>a[0]==='event'&&a[1]==='page_view').map(a=>a[2]));
                  assert.equal(views.length,1);assert.equal(views[0].page_location,origin+path);assert.equal(views[0].page_referrer,'');
                  const config=await page.evaluate(()=>window.dataLayer.find(a=>a[0]==='config')?.[2]);
                  assert.equal(config?.send_page_view,false);assert.equal(config?.allow_google_signals,false);assert.equal(config?.allow_ad_personalization_signals,false);
                  const before=events.length;await emit();await settle();
                  assert.ok(gaLoads>0);assert.ok(events.length>before,'Expected intercepted Sentry event');
                  const e=events.slice(before).find(e=>e?.message==='browser_runtime'&&e?.tags?.route===path);
                  assert.ok(e,'Expected allowlisted route context');
                  assert.deepEqual(e.tags,{route:path});assert.deepEqual(e.extra,{description:'Unexpected public-page runtime error'});
                  assert.ok(Object.keys(e).every(k=>['event_id','timestamp','platform','level','logger','message','fingerprint','environment','tags','extra'].includes(k)));
                  assert.ok(!JSON.stringify(e).includes('synthetic-privacy-marker'));record('opt-in '+path+' sanitized page_view and browser context');
                }
                for(const path of ['/home','/diary','/baocao']){
                  stage='private route '+path;
                  const before=counts();
                  await page.goto(origin+path,{waitUntil:'domcontentloaded',timeout:60000});
                  await page.waitForSelector('main',{visible:true,timeout:30000});assert.equal(new URL(page.url()).pathname,path);
                  await page.waitForFunction(()=>Object.keys(window).some(k=>k.startsWith('ga-disable-G-')&&window[k]===true),{timeout:15000});
                  await emit();await settle();assert.deepEqual(counts(),before);assert.equal(await page.$(selector),null);
                  assert.equal(await page.evaluate(()=>Boolean(window.dataLayer?.some(a=>a[0]==='event'&&a[1]==='page_view'))),false);record('private route excluded '+path);
                }
                await page.goto(origin+'/contact',{waitUntil:'domcontentloaded',timeout:60000});
                await page.waitForSelector(selector,{timeout:30000});
                await page.waitForFunction(()=>window.dataLayer?.some(a=>a[0]==='event'&&a[1]==='page_view'),{timeout:15000});
                await chooseConsent('no');
                await page.waitForFunction(()=>Object.keys(window).some(k=>k.startsWith('ga-disable-G-')&&window[k]===true),{timeout:15000});
                await settle();const before=counts();
                await page.evaluate(()=>window.dispatchEvent(new Event('unhandledrejection')));await settle();
                assert.deepEqual(counts(),before);record('decline disables telemetry');
                return {checks:consent.checks.length};
              }catch(e){consent.checks.push({name:'consent verification',pass:false,stage});throw new Error(stage+': '+String(e.message).slice(0,130));}
              finally{await browser.close();await fs.writeFile('evidence/consent.json',JSON.stringify(consent,null,2));console.log(JSON.stringify(consent,null,2));}
            });
          } finally {
            if(mealId&&cookie) await check('cleanup QA meal',async()=>{const r=await request('/api/diary?id='+encodeURIComponent(mealId),'DELETE');assert.equal(r.status,200);return {status:r.status};});
            if(cookie) await check('logout synthetic session',async()=>{const r=await request('/api/social-auth','DELETE');assert.ok([200,204].includes(r.status));return {status:r.status};});
          }
          console.log(JSON.stringify(result,null,2));if(result.checks.some(x=>!x.pass))process.exitCode=1;
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nutrivn-task4-final-verification
          path: evidence/
          if-no-files-found: error
