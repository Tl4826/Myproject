name: Task 4 - Lighthouse and telemetry
on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'database/error-monitor.mjs'
      - '.github/workflows/task4-lighthouse.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: node scripts/test-telemetry.mjs
      - name: Build Next.js with local mock API proxy
        run: npm run build
        env:
          LOCAL_API_PROXY: http://127.0.0.1:3001
          NEXT_PUBLIC_GA_ID: ''
          NEXT_PUBLIC_SENTRY_DSN: ''
      - name: Install audit tools (CI only)
        run: npm install --no-save --package-lock=false lighthouse@12 puppeteer@24
      - name: Start local mock API and production Next server
        run: |
          node scripts/dev-mock-api.mjs > /tmp/nv-mock.log 2>&1 &
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/nv-next.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null && curl -fsS http://127.0.0.1:3001/api/health > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/nv-mock.log /tmp/nv-next.log
          exit 1
      - run: node scripts/lighthouse-audit.mjs
      - name: Upload actual audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nutrivn-lighthouse
          path: web/lighthouse-reports/
          if-no-files-found: warn
