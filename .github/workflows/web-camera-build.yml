name: Web camera build check

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-camera-build.yml'
  push:
    branches:
      - feature/in-app-camera
    paths:
      - 'web/**'
      - '.github/workflows/web-camera-build.yml'

jobs:
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install frontend
        run: npm --prefix web ci
      - name: Build frontend
        run: npm --prefix web run build
