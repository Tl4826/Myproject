name: Account schema staging
on:
  pull_request:
    branches: [main]
    paths:
      - 'database/migrations/**'
      - 'database/schema.sql'
      - '.github/workflows/account-schema-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: nutrivn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d nutrivn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: test
      PGPASSWORD: synthetic-ci-only
      PGDATABASE: nutrivn_test
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f database/schema.sql
      - run: psql -v ON_ERROR_STOP=1 -f database/migrations/002_account_metadata.sql
      - run: psql -v ON_ERROR_STOP=1 -f database/migrations/002_account_metadata.sql
      - run: psql -v ON_ERROR_STOP=1 -f database/migrations/test_002.sql
