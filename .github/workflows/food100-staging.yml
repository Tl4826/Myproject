name: Food100 staging — model, API, and web

on:
  push:
    branches:
      - feature/food100-staging
  pull_request:
    paths:
      - 'ml/**'
      - 'web/**'
      - 'requirements.txt'
      - '.github/workflows/food100-staging.yml'
  workflow_dispatch:

jobs:
  food100-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API test dependencies
        run: python -m pip install -r requirements.txt httpx onnx
      - name: Assemble and checksum-verify Food100 artifact
        run: python ml/assemble_food100.py
      - name: Validate ONNX input/output and labels
        run: python ml/check_model_100.py
      - name: Run staged Food100 real model API tests
        env:
          MODEL_DIR: ml/models_food100
        run: python -m unittest discover -s ml/service -p 'test_food100_api.py' -v
      - name: Run Food50 fallback API tests
        env:
          MODEL_DIR: ml/models
        run: python -m unittest discover -s ml/service -p 'test_food50_api.py' -v
      - name: Run API ambiguity handling checks
        env:
          MODEL_DIR: ml/models_food100
        run: python -m unittest discover -s ml/service -p 'test_ambiguity_warning.py' -v

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Build Vite
        run: npm --prefix web run build
